name: APK derle
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Derle
        run: |
          cat > package.json <<'EOS'
          { "name": "zenith-hours-mobile", "version": "4.0.0", "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "capacitor-nodejs": "https://github.com/EdenwareApps/Capacitor-NodeJS/releases/download/v1.0.0-beta.9/capacitor-nodejs.tgz"
            },
            "devDependencies": { "@capacitor/cli": "^7.0.0" } }
          EOS
          npm install --legacy-peer-deps
          cd nodejs && npm install --omit=dev --no-audit && cd ..
          find nodejs/node_modules -name "*.gz" -delete
          cp -r nodejs www/nodejs
          npx cap add android
          python3 patch-android.py
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: ZenithHours-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
